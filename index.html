      };
      for (let i = 0; i <= LEVELS; i++) {
        const grey = greyOwn(i);
        build(groups.get(`pole ${i}`), { ...grey, greys: true, i }, null, i);
        for (const pg of pages) {
          const here = pg.levels[i];
          if (!here) continue;
          for (let b = 0; b < here.n; b++) {
            const tone = here.tones[b], list = groups.get(`${pg.s} ${i} ${b}`);
            if (!tone && !list) continue;
            build(list, tone && { oklch: tone.oklch, col: wide.screen(tone.rgb), s: pg.s, i, b, n: here.n }, pg, i, b, here.n);
          }
        }
        yield;
      }

      // The program: hides what's beyond the cut (whole levels in the vertex shader, the cut level's far
      // half in the fragment shader) and the pages hidden, and draws colours (with an empty cell's dot on
      // its card), card, lines, or ids for picking.
      const program = glProgram(gl, `#version 300 es
        in vec3 a_pos; in vec4 a_col; in vec4 a_info; in float a_id, a_page; in vec4 a_extra; in vec2 a_peel;
        uniform mat4 u_mvp; uniform float u_cut, u_cutY, u_from, u_px, u_dpr; uniform int u_mode; uniform ivec2 u_off; uniform bool u_hi; uniform vec3 u_card, u_cardSide; // u_from: 1 cut from the top, -1 from the bottom; u_empty: 0 hidden, 1 only dots, 2 dots on card, 3 filled, 4 every cell a dot; u_off: the pages hidden, a bit each (0-31, 32-35); u_hi: the hovered lone dot, bigger and ringed; u_px: pixels per unit at distance 1
        out vec3 v_col, v_own, v_pos; flat out vec3 v_dot; flat out float v_clip, v_id, v_size, v_sprite, v_dotR;
        ${solidOnFn()}
        void main() {
          float level = a_info.x, kind = a_info.y, other = a_info.w;
          bool atCut = abs(level - u_cut) < 0.5;
          int page = int(a_page + 0.5);
          bool off = page < 32 ? ((u_off.x >> page) & 1) == 1 : page < 64 && ((u_off.y >> (page - 32)) & 1) == 1;
          bool shown = (level - u_cut) * u_from > -0.5 && (kind != 1.0 || atCut) && !off
            && ${solidShown()} && ${solidPeel()};
          bool onFace = other == 5.0 && atCut; // a ball of the cut level: on its face, whole
          vec3 p = onFace ? vec3(a_pos.x, u_cutY + u_from * a_extra.x, a_pos.z) : a_pos;
          gl_Position = shown ? u_mvp * vec4(p, 1.0) : vec4(2.0, 2.0, 2.0, 1.0);
          ${solidDotSize("a_extra.x")}
          bool card = solidCard(a_info.z);
          v_col = solidFaded(card ? (a_col.a > 0.99 ? u_card : u_cardSide) : a_col.rgb * a_col.a, other);
          v_own = solidFaded(a_col.rgb, other);
          v_dot = a_extra.xyz;
          v_dotR = card && solidDotOnCard() && !(a_extra.w < 0.0 && atCut) ? abs(a_extra.w) : 0.0; // an empty cell's dot, on card
          v_pos = p;
          v_clip = atCut && kind != 1.0 && !onFace ? 1.0 : 0.0;
          v_id = a_id;
        }`, `#version 300 es
        precision highp float; precision highp int; // u_mode is shared with the vertex shader: the same precision
        in vec3 v_col, v_own, v_pos; flat in vec3 v_dot; flat in float v_clip, v_id, v_size, v_sprite, v_dotR;
        uniform float u_cutY, u_from, u_dpr; uniform int u_mode; uniform bool u_round, u_hi; uniform vec3 u_line;
        out vec4 colour;
        void main() {
          if (v_clip > 0.5 && (v_pos.y - u_cutY) * u_from > 1e-5) discard; // the cut level's half beyond the cut
          ${solidDot()}
          if (u_mode == 2) { colour = vec4(u_line, 1.0); return; }
          vec3 c = v_col;
          if (v_dotR > 0.0) { // a disc round its middle, its edge smoothed over a pixel
            float d = distance(v_pos, v_dot);
            c = mix(c, v_own, clamp((v_dotR - d) / max(fwidth(d), 1e-6) + 0.5, 0.0, 1.0));
          }
          colour = vec4(c, 1.0);
        }`);
      const ATTRIBUTES = [["a_pos", "pos", 3, gl.FLOAT, false], ["a_col", "col", 4, gl.FLOAT, false], ["a_info", "info", 4, gl.UNSIGNED_BYTE, false],
        ["a_id", "id", 1, gl.FLOAT, false], ["a_page", "page", 1, gl.UNSIGNED_BYTE, false], ["a_extra", "extra", 4, gl.FLOAT, false], ["a_peel", "peel", 2, gl.UNSIGNED_BYTE, false]];
      const loc = Object.fromEntries(ATTRIBUTES.map(([name]) => [name, gl.getAttribLocation(program, name)]));
      const upload = (m) => {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        for (const [name, field, size, type, normalized] of ATTRIBUTES) {
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, m[field]?.subarray(0, m.n * size) ?? new Uint8Array(4), gl.STATIC_DRAW);
          gl.enableVertexAttribArray(loc[name]);
          gl.vertexAttribPointer(loc[name], size, type, normalized, 0, 0);
        }
        if (m.ni) {
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx.subarray(0, m.ni), gl.STATIC_DRAW);
        }
        gl.bindVertexArray(null);
        return { vao, count: m.n, indices: m.ni };
      };
      const meshes = { faces: upload(faces), lines: upload(lines), points: upload(points) };
      yield;
      // Uploaded, the lists are let go, but for the lone dots' places, to sort them by.
      for (const m of [faces, lines, points]) {
        const places = m === points ? m.pos?.slice(0, 3 * m.n) ?? new Float32Array(0) : null;
        for (const [field] of FIELDS) m[field] = null;
        m.idx = null;
        m.pos = places;
      }
      // The piece hovered: its outline, its positions alone (the rest is set for the whole draw).
      const hoverVao = gl.createVertexArray(), hoverBuffer = gl.createBuffer();
      gl.bindVertexArray(hoverVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, hoverBuffer);
      gl.enableVertexAttribArray(loc.a_pos);
      gl.vertexAttribPointer(loc.a_pos, 3, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);

      // The camera: from the red side (hue 10°), so that yellow, most vivid near the top, is on the right,
      // and blue, near the middle, on the left; a little above. The cut is at `level`, from the top (`from`
      // 1: what's above is hidden) or the bottom (-1); at the end it comes from (white from the top, black
      // from the bottom), nothing is cut: the slice there is the tip.
      const view = { az: start?.az ?? 80, el: start?.el ?? 25, level: 0, from: 1, hovered: -1, look: solidLook(SOLID_DEFAULT) }; // (solidCore's)
      const off = new Set(start?.off); // the pages hidden
      const cutLevel = () => {
        const { from, level } = view;
        return !tips ? level : from > 0 ? (level === 0 ? -1 : level) : level === TOP ? TOP + 1 : level;
      };
      const cutY = () => yOf(lightOf(cutLevel()));

      // Round the solid, a button per page, which hides or shows it: the hue's name where it has one, else a
      // dot of its most vivid colour. Each by its page's furthest still shown, following it (those behind
      // fainter; a dot hidden behind the solid).
      // (On the smooth solid, each opens or closes its sector's wedge instead.)
      let wedges = false;
      const marks = [];
      const whatOf = (s) => { // (PCCS names its hues by their numbers: once)
        const name = NAMED.find(([h]) => Math.floor(h / SLICE) === s)?.[1];
        return !name ? `Hue ${pageName(s)}` : name === pageName(s) ? name : `${name}, ${pageName(s)}`;
      };
      const labels = pages.map(({ s }) => {
        const name = NAMED.find(([h]) => Math.floor(h / SLICE) === s)?.[1], what = whatOf(s);
        const b = Object.assign(document.createElement("button"), { type: "button", className: `solid-label${name ? "" : " solid-dot"}` });
        if (name) b.textContent = name;
        else b.style.setProperty("--hue", vivid(s).css);
        const mark = () => {
          const shown = !off.has(s);
          b.setAttribute("aria-pressed", shown);
          b.setAttribute("aria-label", wedges ? `The wedge at ${what}` : `Page: ${what}`);
          b.title = wedges ? `${shown ? "Open" : "Close"} the wedge at ${what}` : `${what}: ${shown ? "hide" : "show"} its page`;
        };
        b.addEventListener("click", () => { if (!off.delete(s)) off.add(s); mark(); request(); walls.onOpened?.(); });
        mark();
        marks.push(mark);
        return b;
      });
      let anchors = [], anchorsFor = "";
      const labelAnchors = () => {
        const { from } = view, key = `${cutLevel()} ${from}`;
        if (key === anchorsFor) return anchors;
        anchorsFor = key;
        const L = lightOf(cutLevel());
        anchors = pages.map(({ h, e }) => {
          let best = 0, row = 0;
          for (let k = 0; k <= 512; k++) { // (of the widest, the nearest the cut: normalised, they're all as wide)
            const ek = e(k / 512);
            if ((k / 512 - L) * from <= 1e-9 && (ek > best + 1e-9 || (ek > best - 1e-9 && Math.abs(k / 512 - L) < Math.abs(row - L)))) [best, row] = [ek, k / 512];
          }
          return best > inner ? at(best + 0.1, h, yOf(row)) : null;
        });
        return anchors;
      };
      // Whether the solid stands between the eye and p: within a page's edge, on the side of the cut shown,
      // sampled along the line where it can be.
      const behind = (p, eye) => {
        const y0 = cutY(), { from } = view;
        for (let i = 0; i < 64; i++) {
          const t = 0.6 + (0.4 * i) / 64, x = eye[0] + (p[0] - eye[0]) * t, y = eye[1] + (p[1] - eye[1]) * t, z = eye[2] + (p[2] - eye[2]) * t;
          const q = y / PAGE_Y + 0.5, h = ((Math.atan2(-z, x) * 180) / Math.PI + 360) % 360;
          if (q > 0 && q < 1 && (y - y0) * from < 0 && Math.hypot(x, z) < pages[pageAt ? pageAt(h) : Math.floor(h / SLICE) % PAGES].e(q)) return true;
        }
        return false;
      };
      const placeLabels = ({ mvp, eye }) => {
        const spots = labelAnchors(), toward = Math.hypot(eye[0], eye[2]) || 1;
        labels.forEach((label, s) => {
          const p = spots[s];
          label.style.visibility = p ? "" : "hidden";
          if (!p) return;
          const [x, y, z] = p, w = mvp[3] * x + mvp[7] * y + mvp[11] * z + mvp[15];
          label.style.left = `${(((mvp[0] * x + mvp[4] * y + mvp[8] * z + mvp[12]) / w + 1) / 2) * 100}%`;
          label.style.top = `${((1 - (mvp[1] * x + mvp[5] * y + mvp[9] * z + mvp[13]) / w) / 2) * 100}%`;
          const facing = (x * eye[0] + z * eye[2]) / (Math.hypot(x, z) * toward);
          label.style.opacity = facing < -0.2 && Math.abs(view.el) < 60 ? 0.35 : 1;
          if (label.classList.contains("solid-dot") && behind(p, eye)) label.style.visibility = "hidden";
        });
      };

      const { request, ...shared } = solidCore({
        canvas, gl, wide, program, meshes, dotsAt: points.pos, targets, lone, spots, view, cutLevel, heightOf: (i) => yOf(lightOf(i)),
        setOff: (at, none) => {
          let low = 0, high = 0;
          if (!none) for (const s of off) if (s < 32) low |= 1 << s; else high |= 1 << (s - 32);
          gl.uniform2i(at, low, high);
        },
        outline: (id) => { // made when it's first hovered: its positions alone (the rest is set for the whole draw)
          const t = targets[id], [body, cap] = (t.lines ??= t.outline().map((list) => new Float32Array(list.flat())));
          gl.bindVertexArray(hoverVao);
          gl.bindBuffer(gl.ARRAY_BUFFER, hoverBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, body.byteLength + cap.byteLength, gl.STREAM_DRAW);
          gl.bufferSubData(gl.ARRAY_BUFFER, 0, body);
          gl.bufferSubData(gl.ARRAY_BUFFER, body.byteLength, cap);
          gl.vertexAttrib1f(loc.a_id, id);
          gl.vertexAttrib1f(loc.a_page, POLE);
          gl.vertexAttrib4f(loc.a_extra, 0, 0, 0, 0);
          gl.vertexAttrib4f(loc.a_col, 0, 0, 0, 1);
          gl.vertexAttrib2f(loc.a_peel, 0, NO_PEEL); // (what's hovered is shown)
          for (const [kind, first, count] of [[BODY, 0, body.length / 3], [CAP, body.length / 3, cap.length / 3]]) {
            gl.vertexAttrib4f(loc.a_info, t.level, kind, 0, 6); // (HI: shown whatever the switches say)
            if (count) gl.drawArrays(gl.LINES, first, count);
          }
        },
        placeLabels, onColour, onCell, onLeave, onOpen, onOpenCell, onRestored,
        // The smooth solid: its edge and colours, the system's own, between its cells' (made when first shown).
        // (Normalised: the cylinder fitted to the view.)
        fit: norm && pages.flatMap(({ h, e }) => steps(0, 1, 20).map((q) => at(e(q), h, yOf(q)))),
        smoothOf: walls.edgeOf && (() => ({
          key: walls.key, Y0: yOf(0), Y1: yOf(1), inner, norm, edge: (h, y) => walls.edgeOf(h, y / PAGE_Y + 0.5), rgbAt: (h, y, r) => wide.screen(walls.linearAt(h, y / PAGE_Y + 0.5, r)),
          sectors: { count: PAGES, start: midHue(0) - SLICE / 2, step: SLICE, dir: 1 }, open: (s) => off.has(s),
        })),
        onPoint: ([h, y, r]) => onPoint(h, y / PAGE_Y + 0.5, r), onOpenPoint: ([h, y, r]) => onOpenPoint(h, y / PAGE_Y + 0.5, r),
      });

      return {
        canvas, labels, ...shared, state: () => ({ az: view.az, el: view.el, off: [...off] }),
        restore: (st) => { // seen from where another was (its state()), its pages hidden
          if (!st) return;
          view.az = st.az ?? view.az;
          view.el = st.el ?? view.el;
          off.clear();
          for (const s of st.off ?? []) off.add(s);
          marks.forEach((mark) => mark());
          request();
        },
        look: (opt) => { shared.look(opt); wedges = opt.bg === "solid"; marks.forEach((mark) => mark()); },
        opened: () => pageRuns(pages.filter(({ s }) => off.has(s)).map(({ s }) => s), PAGES, (s) => NAMED.find(([h]) => Math.floor(h / SLICE) === s)?.[1] ?? `hue ${pageName(s)}`),
        // Its pages as the cake dial has them (see cakeDial), as Ostwald's solid's.
        sectors: { count: PAGES, start: midHue(0) - SLICE / 2, step: SLICE, dir: 1 }, names: pages.map(({ s }) => whatOf(s)),
        hidden: () => [...off],
        hide: (list) => {
          off.clear();
          for (const s of list) off.add(s);
          marks.forEach((mark) => mark());
          request();
        },
      };
    }

    // CMYK for a colour that isn't one of Wada's, estimated as scripts/ostwald_cmyk.py does for the Ostwald
    // view's empty cells: OKLCH -> CIE Lab (D50) -> CMYK through the colorimetric table (B2A1) of a print
    // profile (the one chosen for Print, chosenPrint; Ostwald's, Wada's press), interpolated trilinearly, as
    // LittleCMS does for Lab. Only that table is fetched, as a byte range of the profile (340 KB of Japan
    // Color's 1.9 MB), once per profile, when first asked for; until it's in (or if it can't be had),
    // estimateCMYK gives null.
    function loadPrintTable(id = chosenPrint()) {
      return (printLoads[id] ??= (async () => {
        const PROFILE = `profiles/${profileOf(id).file}.icc`, B2A1 = 0x42324131, MFT2 = 0x6d667432;
        let whole = null; // a server that ignores ranges sends the whole profile: the table is then in it
        const bytes = async (start, end) => {
          if (!whole) {
            const r = await fetch(PROFILE, { headers: { Range: `bytes=${start}-${end - 1}` } });
            if (!r.ok) throw new Error(`${PROFILE}: ${r.status}`);
            const got = await r.arrayBuffer();
            if (r.status === 206) return new DataView(got);
            whole = got;
          }
          return new DataView(whole, start, end - start);
        };
        // The tag table: per tag, its signature, offset and size.
        const head = await bytes(0, 4096), tags = head.getUint32(128);
        let tag = null;
        for (let i = 0; i < tags && !tag; i++) {
          const at = 132 + 12 * i, offset = head.getUint32(at + 4);
          if (head.getUint32(at) === B2A1) tag = await bytes(offset, offset + head.getUint32(at + 8));
        }
        if (!tag || tag.getUint32(0) !== MFT2 || tag.getUint8(8) !== 3 || tag.getUint8(9) !== 4) throw new Error("no 16-bit Lab -> CMYK table");
        // A lut16Type: input curves, the grid (first input slowest), output curves; 0..65535 as 0..1.
        const grid = tag.getUint8(10), inSize = tag.getUint16(48), outSize = tag.getUint16(50);
        let pos = 52;
        const read = (n) => {
          const values = new Float64Array(n);
          for (let k = 0; k < n; k++, pos += 2) values[k] = tag.getUint16(pos) / 65535;
          return values;
        };
        const inCurves = [read(inSize), read(inSize), read(inSize)], clut = read(grid ** 3 * 4);
        printTables[id] = { grid, inCurves, clut, outCurves: [read(outSize), read(outSize), read(outSize), read(outSize)] };
      })().catch(() => {})); // no estimates, then: the panel says the colour isn't in Wada's palette
    }
    // The profile chosen for each kind (the print one also for the estimates), as saved; and the one a view
    // shows: Print's, if Print is chosen and its gamut is in, else Screen's.
    function chosenProfile(kind) {
      const id = stored(`${SHARED}${kind}`);
      return profileOf(id)?.kind === kind ? id : PROFILE_DEFAULTS[kind];
    }
    function chosenPrint() { return chosenProfile("print"); }
    function shownProfile() {
      const print = stored(`${SHARED}range`) === "print" && chosenPrint();
      return print && gamutTables[print] ? print : chosenProfile("screen");
    }

    // CMYK in percent for [L, C, h] through print profile `id` (its short name as `profile`), or null while
    // its table isn't in.
    function estimateCMYK([L, C, h], id = chosenPrint()) {
      const table = printTables[id];
      if (!table) return null;
      const { grid, inCurves, clut, outCurves } = table;
      const curve = (table, x) => { // piecewise linear, x in 0..1
        const p = Math.min(Math.max(x, 0), 1) * (table.length - 1), i = Math.min(p | 0, table.length - 2);
        return table[i] + (table[i + 1] - table[i]) * (p - i);
      };
      const [l, a, b] = oklchToLab(L, C, h);
      // ICC v2's 16-bit Lab: L 0..100 as 0..0xFF00; a and b 0 as 0x8000.
      const x = [(l * 652.8) / 65535, ((a + 128) * 256) / 65535, ((b + 128) * 256) / 65535].map((v, k) => curve(inCurves[k], v));
      const g = grid - 1, lo = [], frac = [];
      for (const v of x) {
        const p = Math.min(Math.max(v, 0), 1) * g, i = Math.min(p | 0, g - 1);
        lo.push(i);
        frac.push(p - i);
      }
      const y = [0, 0, 0, 0];
      for (let corner = 0; corner < 8; corner++) { // the cube's 8 nodes round it, each by its nearness
        let w = 1, node = 0;
        for (let k = 0; k < 3; k++) {
          const up = (corner >> k) & 1;
          w *= up ? frac[k] : 1 - frac[k];
          node = node * grid + lo[k] + up;
        }
        if (w) for (let o = 0; o < 4; o++) y[o] += w * clut[node * 4 + o];
      }
      return Object.assign(y.map((v, o) => Math.round(100 * curve(outCurves[o], v))), { profile: profileOf(id).short });
    }

    // OKLCH -> CIE Lab (D50): the inverse of scripts/cmyk_to_oklch.py's maths (CSS Color 4's), with its
    // matrices inverted as scripts/ostwald_cmyk.py does.
    function oklchToLab(L, C, h) {
      const D65_TO_D50 = [[1.0479297925449969, 0.02294687060160972, -0.05019226628920526], [0.029627808770055802, 0.99043442675388, -0.017073799063418812], [-0.009243040646204523, 0.015055191490298147, 0.7518742814281371]];
      const D50 = [0.9642956764295677, 1, 0.8251046025104602]; // the white
      const [X, Y, Z] = Array.from(times3(D65_TO_D50, xyzOf([L, C, h])), (v, k) => v / D50[k]);
      const f = (t) => (t > 216 / 24389 ? t ** (1 / 3) : ((24389 / 27) * t + 16) / 116);
      return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
    }
  </script>
