<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ducktape Colours | Colour systems</title>
  <!-- The Ostwald wheel, simplified: as SVG, else as PNG (sizes keeps browsers on the SVG). -->
  <link rel="icon" href="favicon.png" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- The theme chosen in this browser (light or dark; none: the system's), set before the page is drawn. -->
  <script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
  <!-- Fetched at once, not once the whole page is in and its script runs: the font most text is in, and
       the data every view needs (the script's fetches then get these). -->
  <link rel="preload" href="fonts/DMMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="colors.json" as="fetch" crossorigin>
  <style>
    :root {
      color-scheme: light;
      --bg: #fafaf7;
      --fg: #1d1d1b;
      --muted: #6e6e68;
      --line: #e3e3dd;
      --page-l: 0.9843; /* --bg's OKLab lightness, for fading (see fadeBoost) */
      --info: 26ch; /* widest info line: OKLCH 0.5579 0.1582 357.38 */
      --mono: "DM Mono", "Noto Serif JP", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    /* The dark theme: the system's, unless light is chosen, or chosen (the header's switch). The same four
       colours, turned round; everything else follows them. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --bg: #181817; --fg: #e8e8e3; --muted: #9a9a93; --line: #34342f; --page-l: 0.2086; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #181817; --fg: #e8e8e3; --muted: #9a9a93; --line: #34342f; --page-l: 0.2086; }
    /* DM Mono (SIL Open Font License, fonts/OFL.txt), from github.com/google/fonts/tree/main/ofl/dmmono,
       as WOFF2 (made with fontTools); the fallback shows until it's in (swap). It has no bold: Medium
       (500) is the heaviest weight. */
    @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    /* Noto Serif JP (fonts/OFL-NotoSerifJP.txt), for the Japanese (a colour's name in its card): from
       github.com/google/fonts (ofl/notoserifjp), made static and cut down with fontTools to the Japanese
       characters used (its unicode-range, so it's fetched only for those). Re-cut it when new Japanese is added. */
    @font-face { font-family: "Noto Serif JP"; src: url("fonts/NotoSerifJP-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+3068, U+306E, U+30FB, U+4E01, U+4E09, U+4E39, U+4EAC, U+5176, U+51AC, U+5375, U+548C, U+5716, U+5B50, U+5B57, U+5E16, U+5F69, U+6236, U+6688, U+6728, U+673D, U+675C, U+67D1, U+6854, U+6885, U+6897, U+6982, U+6A19, U+6A59, U+6A9C, U+6B35, U+6D3B, U+6D77, U+6DE1, U+6DFA, U+6E96, U+6FC3, U+7070, U+7261, U+7528, U+7530, U+767D, U+76AE, U+78C1, U+7A7A, U+7AF9, U+7D05, U+7D0D, U+7D2B, U+7D3A, U+7DA0, U+7DD1, U+7E3D, U+7E5D, U+7FBD, U+8001, U+8272, U+82E5, U+8336, U+8349, U+83D6, U+8420, U+8449, U+8471, U+84B2, U+85E4, U+8AAA, U+8AAC, U+8D64, U+9020, U+914D, U+9451, U+9644, U+96C6, U+9751-9752, U+9CE9, U+9D3E, U+9DB8, U+9EC3-9EC4, U+9ED1-9ED2, U+FF0B; }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }
    body { font-family: var(--mono); background: var(--bg); color: var(--fg); }

    /* Header: the site's name, and the theme's switch. */
    header {
      position: sticky; top: 0; z-index: 3;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    nav {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem; /* the switch beside the name, however it wraps */
      padding: 1rem 1.5rem;
    }
    nav strong { font-weight: 500; }
    /* The site's icon (the wheel) before its name, as tall as a line of it, level with the first. */
    .brand { display: flex; align-items: flex-start; gap: 0.625rem; line-height: 1.25rem; }
    .brand img { flex: none; width: 1.25rem; height: 1.25rem; }
    .brand { color: inherit; text-decoration: none; } /* a link to the top */
    .brand:is(:hover, :focus-visible) strong { text-decoration: underline; text-underline-offset: 0.25em; }
    nav span { color: var(--muted); }
    .views { display: flex; flex: none; gap: 1rem; }
    /* The theme's switch: a circle half filled. */
    .theme-switch { display: inline-grid; place-items: center; align-self: center; padding: 0.25rem; margin: -0.25rem; border: 0; background: none; color: var(--muted); cursor: pointer; }
    .theme-switch:is(:hover, :focus-visible) { color: var(--fg); }
    main { padding: 1.5rem; }
    #systems-view { display: grid; gap: 2rem; }
    /* Colour systems: the one shown (data-system: the one chosen, once it's made). */
    #systems-view:not([data-system="oklch"]) > .wheel-box,
    #systems-view:not([data-system="ostwald"]) > .ostwald-box,
    #systems-view:not([data-system="munsell"]) > .munsell-box,
    #systems-view:not([data-system="pccs"]) > .pccs-box { display: none; }
    /* A colour's name, then a square of it (the card's title, the panel's). */
    .named { display: flex; align-items: center; gap: 1ch; }
    .chip { flex: none; width: 0.875rem; height: 0.875rem; background: var(--color); }
    /* Wheel layout: wheel (angle = hue, distance from centre = chroma) centred on the page, as tall as
       the screen below the header; the info panel floats at the left middle of the screen, outside the
       layout, so it never moves the wheel. */
    .wheel-box { display: grid; justify-items: center; }
    .wheel { position: relative; width: min(100%, calc(100vh - 10rem)); aspect-ratio: 1; }
    .wheel-panel {
      position: fixed; left: 1.5rem; top: 50%; transform: translateY(-50%); z-index: 2;
      width: var(--info);
      line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none;
      opacity: 0; transition: opacity 0.6s ease; /* fade out */
    }
    .wheel-panel.show { opacity: 1; transition-duration: 0.12s; /* fade in */ }
    .wheel-panel .detail-swatch { height: auto; aspect-ratio: 2; margin-bottom: 0.75rem; }
    .wheel-panel h2 { font: inherit; }
    .wheel svg { display: block; width: 100%; height: 100%; }
    :is(.wheel, .atlas-disc) .segment { stroke: var(--bg); stroke-width: 0.004; cursor: pointer; outline: none; }
    .wheel-bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.35; pointer-events: none; }
    .wheel svg { position: relative; }
    .wheel > .highlight-layer { position: absolute; inset: 0; pointer-events: none; will-change: transform; } /* the hovered outline, over the colours, on a layer of its own */
    :is(.wheel, .atlas-disc) .highlight { fill: none; stroke: var(--fg); stroke-width: 0.008; pointer-events: none; }
    .wheel .highlight.on-dark { stroke: var(--bg); } /* in 2D, round a dark colour on the slice's own dark ones */
    /* The Colour systems page's OKLCH layout, the wheel with its switches under a column to its right, as in the Ostwald view: Flat
       (the wheel above), or 2D, a slice of OKLCH's solid, with its control in that column (the lightness
       levels, or the dial); and squares or dots. */
    .wheel-views {
      --h: min(calc(100vh - 12rem), calc((100vw - 7rem) / 1.72)); /* the wheel's size: as the other systems' discs' (.atlas), so that the control and the switches are where theirs are */
      justify-self: stretch; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.75rem 2rem;
    }
    .wheel-views > .wheel { grid-column: 2; width: var(--h); }
    #systems-view .wheel-views > .wheel { margin-inline: calc(var(--h) * 0.25 / 2.4); } /* in a frame as wide as the other systems' discs (2.9 / 2.4 of its height), centred */
    .wheel .dot { cursor: pointer; outline: none; }
    .wheel .dot-hit { fill: transparent; } /* round the dot, as far as its neighbours leave room: easier to hover */
    .wheel :is(.dot-mark, .on-axis) { stroke: var(--line); stroke-width: 0.002; } /* as the Ostwald view's dots: pale ones show (and white, on the axis) */
    .wheel .gamut, :is(.wheel, .atlas-disc) .rim { fill: none; stroke: var(--muted); stroke-width: 0.003; pointer-events: none; }
    :is(.wheel, .atlas-disc) .rim { stroke-dasharray: 0.01 0.015; } /* the widest the slices go, for scale */
    .wheel .gamut { pointer-events: fill; cursor: pointer; } /* hovering the slice, off Wada's colours, shows its own colour */
    /* The views: the background, OKLCH's own colours, as the switches say, smooth or each cell filled, on the canvas, at full strength or faded; the cells' borders a thin grey line, as the other systems' grids; the outline of what the range holds drawn in real space, round smooth, dots and none, and hovered on smooth (the colour exactly under the pointer) and the cells (that cell's colour), not on none (only Wada's colours) */
    .wheel-views[data-bg] .wheel-bg { opacity: 1; }
    .wheel-views[data-bg][data-strength="faded"] .wheel-bg, .wheel-views[data-strength="faded"] .wheel :is(.cell-lines, .cell-dot) { opacity: 0.35; }
    .wheel-views:is([data-bg="griddot"], [data-bg="dots"], [data-bg="none"]) .wheel-bg { display: none; }
    .wheel-views:is([data-bg="grid"], [data-bg="griddot"], [data-space="normalised"]) .gamut { stroke: none; }
    .wheel-views[data-bg="smooth"] .gamut { cursor: crosshair; }
    .wheel-views[data-bg="none"] .gamut { pointer-events: none; }
    .wheel .cell-lines { fill: none; stroke: rgb(140 140 140 / 0.75); stroke-width: 0.0025; pointer-events: none; }
    .wheel .cell-dot { stroke: var(--line); stroke-width: 0.002; pointer-events: none; }
    /* Wada's colours, squares or dots, on any surface and in the flat wheel: their true colour, ringed white, then dark (.mark-halo, the same shape under it), with a small shadow, so that each reads as a mark on whatever is round it, as the Munsell and PCCS views' dots. */
    .wheel-views .wheel :is(.segment, .dot-mark) { stroke: rgb(255 255 255 / 0.95); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
    .wheel-views .wheel .halos { pointer-events: none; }
    :is(.wheel-views .wheel, .atlas-disc) .mark-halo { fill: none; stroke: rgb(0 0 0 / 0.7); stroke-width: 3.4px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    :is(.wheel-views .wheel, .atlas-disc) .mark-halo.shadow { stroke: rgb(0 0 0); stroke-width: 5px; } /* the small shadow: the halo again, a little lower and wider, faint (a CSS filter on the group would tint the whole region it covers) */
    :is(.wheel-views .wheel, .atlas-disc) .shadows { opacity: 0.22; } /* faint as one: where the pieces' shadows overlap (at their corners), no darker */
    .wheel-views:not([data-view="level"], [data-view="3d"]) > .lightness-levels { display: none; }
    /* 3D: OKLCH's solid on a canvas in the wheel's place (as the Ostwald view's: see .atlas-solid), with its pages' labels round it, which follow it */
    /* Its labels: buttons that hide or show their page, as the Ostwald view's (whose .solid-label rules, below, apply too), placed as those are */
    .wheel > .solid-label { position: absolute; display: none; transform: translate(var(--dx), -50%); color: var(--muted); font-size: 0.75rem; white-space: nowrap; text-align: var(--align); }
    .wheel > .solid-label:not(.solid-dot) { z-index: 1; } /* the names over the dots, legible where they meet */
    .wheel-views[data-view="3d"] .wheel > :is(.oklch-solid, .solid-label) { display: block; }
    .wheel-views[data-view="3d"] .wheel > :is(svg, .wheel-bg) { display: none; }
    .wheel-views[data-view="pages"] > .dial-box { display: block; }
    @media (prefers-reduced-motion: reduce) { .swatch span, .wheel-panel { transition: none !important; } }

    /* Ostwald layout: one level of Ostwald's colour solid at a time, seen from above (angle = hue,
       distance from the centre = colour content), centred on the page as the OKLCH layout's wheel is, with its control
       to the right: Wada's 16 greys, white at the top, and the solid's outline with the level marked. The
       info panel floats at the left, as the OKLCH layout's. */
    .atlas {
      /* the disc's height: the screen's below the header, or its width less room for the control
         (0.25 of it) on both sides, so that the disc stays centred */
      --h: min(calc(100vh - 12rem), calc((100vw - 7rem) / 1.72));
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.75rem 2rem;
    }
    .atlas-disc { grid-column: 2; position: relative; height: var(--h); aspect-ratio: 2.9 / 2.4; }
    .atlas-disc svg { display: block; width: 100%; height: 100%; }
    .atlas-disc .empty { fill: none; stroke: var(--line); stroke-width: 0.003; pointer-events: visible; cursor: pointer; } /* none of Wada's colours here; hovering shows the system's own colour */
    .atlas-disc :is(.ideal, .colour-dot) { stroke: var(--line); stroke-width: 0.002; pointer-events: none; }
    .atlas-disc .segment.hit { fill: none; stroke: none; pointer-events: visible; } /* every cell a dot: a colour's piece of its cell, unseen, to hover */
    .atlas-disc[data-empty="filled"] .empty { fill: var(--own); stroke: var(--bg); stroke-width: 0.004; } /* as Wada's colours are drawn */
    .atlas-disc:is([data-empty="points"], [data-empty="all"]) .empty { stroke: none; } /* the dots alone; hovering still outlines the cell */
    .atlas-disc[data-empty="filled"] .ideal, .atlas-disc[data-empty="hidden"] :is(.empty, .ideal) { display: none; }
    /* The background (Munsell's, PCCS's and Ostwald's views, as the switches say): smooth, the field painted on a canvas under the svg (clipped to its outline), its outline over it (to hover); a grid, each cell filled and its border a thin grey line, which reads on light and dark cells alike and isn't a mark's white and dark ring; faded, at a third of its strength */
    .atlas-disc > svg { position: relative; }
    .atlas-surface { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
    .atlas-disc[data-surface="smooth"]:not([data-mode="3d"], [data-slicing="tones"]) > .atlas-surface { display: block; }
    .atlas-disc .surface { fill: transparent; stroke: var(--line); stroke-width: 0.003; pointer-events: visible; cursor: crosshair; }
    .atlas-disc[data-space="normalised"] .surface { stroke: none; } /* the outline only in real space */
    .atlas-disc:not([data-surface="smooth"]) .surface { pointer-events: none; cursor: auto; } /* only the smooth field is hovered between Wada's colours */
    .atlas-disc[data-bg="grid"] .empty { stroke: rgb(140 140 140 / 0.75); stroke-width: 0.0025; }
    .atlas-disc[data-strength="faded"] > .atlas-surface, .atlas-disc[data-strength="faded"] :is(.empty, .ideal) { opacity: 0.35; }
    /* Faded, each cell's chroma raised first, the more the darker it is, so that dark slices keep their hues (see fadeBoost) */
    .atlas-disc[data-strength="faded"][data-empty="filled"] .empty, .atlas-disc[data-strength="faded"] .ideal, .wheel-views[data-strength="faded"] .wheel .cell-dot { fill: oklch(from var(--own) l calc(c * (1 + 1.86 * clamp(0, (max(l - var(--page-l), var(--page-l) - l) - 0.3843) / 0.3, 1))) h); }
    /* Wada's colours, squares or dots, on whatever is round them: their own colour, ringed white, then dark round that (whatever the theme, as the field's colours are), so that each reads as a mark, not a hole, on light, dark and vivid colours alike. No CSS filter on the dots: one each cost the GPU up to 300 ms a frame and showed nothing */
    .atlas-disc .colour-dot.on-field { stroke: rgb(255 255 255 / 0.95); stroke-width: 0.005; }
    .atlas-disc .dot-halo { fill: none; stroke: rgb(0 0 0 / 0.7); stroke-width: 0.0035; pointer-events: none; }
    .atlas-disc .segment.on-field { stroke: rgb(255 255 255 / 0.95); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
    .atlas-disc .halos { pointer-events: none; }
    .atlas-label {
      position: absolute; transform: translate(var(--dx), -50%);
      color: var(--muted); font-size: 0.75rem; white-space: nowrap; text-align: var(--align); pointer-events: none;
    }
    .view-caption { grid-column: 2; grid-row: 2; align-self: start; padding-top: 0.25rem; contain: inline-size; margin: 0; color: var(--muted); font-size: 0.8rem; text-align: center; } /* wraps to the disc's width */
    .view-caption .chip { display: inline-block; width: 0.75em; height: 0.75em; margin-left: 0.5ch; vertical-align: -0.05em; }
    .view-caption .hue-name { white-space: nowrap; } /* a hue's name with its square (and comma): never split */
    /* Sliced through the axis, the caption has a button each side to turn to the previous or next pages. */
    .view-caption.turns { display: flex; justify-content: center; align-items: center; gap: 0.75rem; padding-top: 0; }
    .page-turn {
      flex: none; display: grid; place-items: center; width: 1.75em; height: 1.75em; padding: 0;
      border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--muted); cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .page-turn[hidden] { display: none; }
    .page-turn:hover { color: var(--fg); border-color: var(--muted); }
    .page-turn:focus-visible { outline: 1px solid var(--fg); outline-offset: 1px; }
    .page-turn svg { width: 0.85em; height: 0.85em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    /* 3D: the whole solid on a canvas in the disc's place, with its own hue labels, which follow it */
    :is(.atlas-solid, .oklch-solid) { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: grab; outline: none; }
    :is(.atlas-solid, .oklch-solid):active { cursor: grabbing; }
    :is(.atlas-solid, .oklch-solid):focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }
    .atlas-disc[data-mode="3d"] > .atlas-solid { display: block; }
    .atlas-disc[data-mode="3d"] > :is(svg, .atlas-label:not(.solid-label)), .atlas-disc:not([data-mode="3d"]) > .solid-label { display: none; }
    .solid-label { --dx: -50%; --align: center; padding: 0 0.25em; background: color-mix(in srgb, var(--bg) 80%, transparent); transition: opacity 0.2s; } /* legible over the solid */
    /* Each a button: shows or hides its hue's page. The pages with no name have a dot of their full colour. */
    .solid-label { font-family: inherit; line-height: inherit; border: 0; pointer-events: auto; cursor: pointer; }
    .solid-label:hover { color: var(--fg); }
    .solid-label:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
    [data-labels="hidden"] .solid-label { display: none !important; } /* the 3D labels switch: the solid alone */
    .solid-label[aria-pressed="false"] { text-decoration: line-through; color: color-mix(in srgb, var(--muted) 60%, transparent); }
    .atlas-label.solid-dot, .wheel > .solid-label.solid-dot { --dx: -50%; width: 0.55rem; height: 0.55rem; padding: 0; border-radius: 50%; background: var(--hue); border: 1.5px solid var(--hue); }
    .atlas-label.solid-dot[aria-pressed="false"], .wheel > .solid-label.solid-dot[aria-pressed="false"] { background: var(--bg); }
    .solid-dot::before { content: ""; position: absolute; inset: -0.45rem; } /* a bigger target */
    /* The switches above the view (switchBar): small segmented switches in named groups, System, View and
       Profile in a row, the view's Options in the next, centred, in the same place in every system (the
       disc's size, and the caption's length, change below them); on wide screens the disc smaller by them. */
    #systems-view .view-modes { grid-column: 1 / -1; grid-row: 1; justify-self: center; width: 0; min-width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0.55rem; font-size: 0.7rem; }
    .mode-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 0.55rem 1.4rem; }
    .mode-group { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
    .mode-group:has(> .group-body:empty) { display: none; }
    .group-name { font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .group-body { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.3rem; }
    /* The profile's menu, a pill as the switches are, its arrow drawn in the muted colour. */
    .profile-select {
      font: inherit; width: 15.5em; height: calc(1.9em + 6px); padding: 0 2em 0 0.85em; /* (as wide as the longest name, so that the row stays put) */ border: 1px solid var(--line); border-radius: 999px; color: var(--fg); cursor: pointer; appearance: none;
      background: linear-gradient(45deg, transparent 50%, var(--muted) 50%) calc(100% - 1.05em) 55% / 0.32em 0.32em no-repeat, linear-gradient(135deg, var(--muted) 50%, transparent 50%) calc(100% - 0.73em) 55% / 0.32em 0.32em no-repeat, transparent;
    }
    .profile-select option { background: var(--bg); color: var(--fg); }
    .profile-select:hover:not(:disabled) { border-color: var(--muted); }
    .profile-select:disabled { opacity: 0.45; cursor: default; }
    .profile-select:focus-visible { outline: 1px solid var(--fg); outline-offset: 1px; }
    #systems-view :is(.atlas-disc, .atlas-levels, .dial-box, .cake-box, .wheel-views > .wheel, .lightness-levels) { grid-row: 2; }
    #systems-view .view-caption { grid-row: 3; }
    #systems-view :is(.wheel-box, .ostwald-box, .munsell-box) :is([data-option="slicing"], [data-option="wheel-slicing"], [data-option="cut"], [data-option="wheel-cut"]) { margin-right: calc(1.75em + 1px); } /* room for PCCS's third slice (the tones) in every system and in 3D's cut in its place, so that the centred row doesn't move */
    @media (min-width: 601px) { #systems-view :is(.atlas, .wheel-views) { --h: min(calc(100vh - 18.9rem), calc((100vw - 7rem) / 1.72)); } } /* (the screen less the header, the switches' two rows and the caption) */
    .view-option { display: flex; align-items: center; gap: 0.45em; color: var(--muted); white-space: nowrap; }
    .view-option[hidden] { display: none; }
    .view-option > span { display: none; } /* no room beside the control: the choices' tooltips say what they are */
    @media (hover: none), (max-width: 600px) { .view-option > span { display: inline; } } /* no tooltips on touch: a label (and room for it on phones) */
    .view-switch { display: inline-flex; gap: 1px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; }
    .view-switch button {
      font: inherit; display: flex; align-items: center; justify-content: center; min-width: 1.9em; height: 1.9em; padding: 0 0.4em;
      border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; transition: background-color 0.15s, color 0.15s;
    }
    .view-option button { min-width: 1.75em; padding: 0 0.325em; } /* the icons: a little narrower, so that the switches fit in a line beside a disc as tall as the screen allows (on wide screens) */
    .view-switch button:hover:not(:disabled) { color: var(--fg); }
    .view-switch button[aria-pressed="true"] { background: color-mix(in srgb, var(--fg) 9%, transparent); color: var(--fg); }
    .view-switch button:disabled { opacity: 0.45; cursor: default; }
    .view-switch button[hidden] { display: none; }
    .view-switch button:focus-visible { outline: 1px solid var(--fg); outline-offset: 1px; }
    .view-switch svg { display: block; width: 1.1em; height: 1.1em; fill: currentColor; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
    :is(.atlas-levels, .lightness-levels) {
      grid-column: 3; justify-self: start;
      display: block; height: calc(var(--h) * 0.85); aspect-ratio: 9.8 / 33.2;
      cursor: ns-resize; touch-action: none; outline: none; user-select: none; -webkit-user-select: none;
    }
    :is(.atlas-levels, .lightness-levels) * { vector-effect: non-scaling-stroke; } /* strokes in screen pixels */
    :is(.atlas-levels, .lightness-levels) :is(.outline, .strip) { fill: none; stroke: var(--muted); stroke-width: 1px; }
    .atlas-levels .equator { stroke-dasharray: 3 3; }
    .atlas-levels .axis { stroke: var(--line); stroke-width: 1px; }
    .atlas-levels .section { opacity: 0.6; } /* a wash: the outlines still show through */
    .atlas-levels .section path { stroke-width: 0.5px; } /* its own colour: no seams between cells */
    :is(.atlas-levels, .lightness-levels) :is(.slice, .ghost) { fill: none; } /* painted with their level's disc instead */
    :is(.atlas-levels, .lightness-levels) .slice { fill: var(--fg); fill-opacity: 0.12; stroke: var(--fg); stroke-width: 1.5px; }
    :is(.atlas-levels, .lightness-levels) .ghost { fill: var(--fg); fill-opacity: 0.05; stroke: var(--fg); stroke-width: 1px; stroke-dasharray: 3 2; } /* the level previewed under the pointer */
    :is(.atlas-levels, .lightness-levels) .marker { stroke: var(--fg); stroke-width: 1.5px; }
    :is(.atlas-levels, .lightness-levels) .pointer { fill: var(--fg); }
    :is(.atlas-levels, .lightness-levels) text { font-family: inherit; pointer-events: none; }
    :is(.atlas-levels, .lightness-levels):focus-visible .strip { stroke: var(--fg); stroke-width: 2px; }
    /* The solid's peel (3D): a strip under the outline, its strength from the greys out, faded beyond the
       peel, the part kept outlined (as the level's slice); the shell's outline dashed, and fainter, the peel previewed.
       Only with the control's data-peel. */
    :is(.atlas-levels, .lightness-levels) .peel { display: none; cursor: ew-resize; outline: none; }
    :is(.atlas-levels, .lightness-levels)[data-peel] .peel { display: inline; }
    :is(.atlas-levels, .lightness-levels) .peel-hit { fill: transparent; }
    :is(.atlas-levels, .lightness-levels) .peel-bar { fill: none; stroke: var(--muted); stroke-width: 1px; } /* as the level's strip */
    :is(.atlas-levels, .lightness-levels) .peel-cells { opacity: 0.2; } /* peeled: faded, as the dial's slices hidden */
    :is(.atlas-levels, .lightness-levels) .peel-cells rect { stroke: none; }
    :is(.atlas-levels, .lightness-levels) .peel-kept { fill: none; stroke: var(--fg); stroke-width: 1.5px; }
    :is(.atlas-levels, .lightness-levels) .peel-shell { fill: none; stroke: var(--fg); stroke-width: 1px; stroke-dasharray: 3 2; pointer-events: none; }
    :is(.atlas-levels, .lightness-levels) .peel-ghost { fill: none; stroke: var(--fg); stroke-opacity: 0.5; stroke-width: 1px; stroke-dasharray: 3 2; pointer-events: none; }
    :is(.atlas-levels, .lightness-levels) rect.peel-ghost { fill: var(--fg); fill-opacity: 0.05; }
    :is(.atlas-levels, .lightness-levels) .peel:focus-visible .peel-bar { stroke: var(--fg); stroke-width: 2px; }
    /* Sliced through the axis (2D): the two pages, with their hues named at their tips, and the dial in
       the control's place: the solid's middle level seen from above, the two pages bright, the slice
       across it, and a pointer at the page on the right. */
    .atlas-disc:not([data-slicing="pages"]) > .page-label, .atlas-disc[data-slicing="pages"] > .level-label { display: none; }
    .dial-box { grid-column: 3; display: none; container-type: inline-size; min-width: calc(var(--h) * 0.3); } /* the column's width, to fit the dial and its labels in; at least the dial's */
    .atlas[data-view="pages"] > .dial-box { display: block; }
    .dial-face { /* the dial and its labels: room on the left for the longest, as wide as fits, up to the control's size */
      position: relative; width: min(calc(var(--h) * 0.3), calc(100cqw - 5.8rem)); margin-left: 4.1rem;
      cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .hue-dial { display: block; width: 100%; aspect-ratio: 1; outline: none; }
    .atlas[data-view="pages"] > .atlas-levels { display: none; }
    /* PCCS's tones (2D): no level to choose; each tone's code in its ring, or beside its grey disc */
    .atlas[data-view="tones"] > .atlas-levels, .atlas-disc[data-slicing="tones"]:not([data-focus="ring"]) > .level-label { display: none; } /* zoomed into a tone's ring, its hues are named as the disc's */
    .atlas[data-view="flat"] > .atlas-levels { display: none; } /* Munsell's flat view: every value at once, none to choose */
    .atlas-disc .tone-code { fill: var(--muted); font-family: inherit; pointer-events: none; transition: fill 0.15s; }
    /* A tone's code, a button: zooms into the tone, or (zoomed in) back to the map. */
    .atlas-disc .tone-link { cursor: pointer; outline: none; }
    .atlas-disc .tone-link .hit { fill: transparent; stroke: none; transition: fill 0.15s; }
    @media (hover: hover) { .atlas-disc .tone-link:hover .hit { fill: color-mix(in srgb, var(--line) 45%, transparent); } }
    .atlas-disc .tone-link:is(:hover, :focus-visible) .tone-code { fill: var(--fg); }
    .atlas-disc .tone-link:focus-visible .hit { stroke: var(--fg); stroke-width: 0.004; }
    .tone-back {
      position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 0.3em; padding: 0.3em 0.75em 0.3em 0.5em;
      border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--muted); font: inherit; font-size: 0.8rem; cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .tone-back[hidden], .atlas-disc:not([data-slicing="tones"]) > .tone-back { display: none; }
    .tone-back:hover { color: var(--fg); border-color: var(--muted); }
    .tone-back:focus-visible { outline: 1px solid var(--fg); outline-offset: 1px; }
    .tone-back svg { width: 0.85em; height: 0.85em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .hue-dial * { vector-effect: non-scaling-stroke; } /* strokes in screen pixels */
    .hue-dial .hue { opacity: 0.35; transition: opacity 0.15s; }
    .hue-dial .hue.on { opacity: 1; }
    .hue-dial .hue path { stroke-width: 0.5px; } /* its own colour: no seams between cells */
    .hue-dial .rim { fill: none; stroke: var(--muted); stroke-width: 1px; }
    .hue-dial .cut { stroke: var(--fg); stroke-width: 1.5px; }
    .hue-dial .ghost { stroke: var(--fg); stroke-width: 1px; stroke-dasharray: 3 2; } /* the pages previewed under the pointer */
    .hue-dial .pointer { fill: var(--fg); }
    .hue-dial:focus-visible .rim { stroke: var(--fg); stroke-width: 2px; }
    /* 3D (the Colour systems page's): the cake dial over the level control, its middle over the outline's
       axis and its top view about as wide as the outline (a plan over its elevation), the control shorter
       to make room, the two as tall as the control alone; on phones, below the solid. The top view, turned
       with the solid, the slices hidden faded; the cut, and its pointers (see cakeDial). */
    .cake-box { display: none; }
    #systems-view :is(.atlas, .wheel-views)[data-view="3d"] > .cake-box {
      display: block; grid-column: 3; justify-self: start; align-self: start;
      width: calc(var(--h) * 0.17); margin: calc(var(--h) * 0.07) 0 0 calc(var(--h) * 0.04);
    }
    #systems-view :is(.atlas, .wheel-views)[data-view="3d"] > :is(.atlas-levels, .lightness-levels) { height: calc(var(--h) * 0.646); align-self: end; margin-bottom: calc(var(--h) * 0.049); }
    @media (max-width: 600px) {
      #systems-view :is(.atlas, .wheel-views)[data-view="3d"] > .cake-box { grid-column: 1 / -1; grid-row: 4; justify-self: center; width: 7.5rem; margin: 1rem 0 0; }
      #systems-view :is(.atlas, .wheel-views)[data-view="3d"] > :is(.atlas-levels, .lightness-levels) { height: calc(var(--h) * 0.85); align-self: center; margin-bottom: 0; }
    }
    .cake-dial { display: block; width: 100%; height: auto; aspect-ratio: 1; overflow: visible; touch-action: none; user-select: none; -webkit-user-select: none; }
    .cake-dial * { vector-effect: non-scaling-stroke; } /* strokes in screen pixels */
    .cake-dial[data-aim="slice"] { cursor: pointer; }
    .cake-dial[data-aim="pointer"] { cursor: grab; }
    .cake-dial[data-aim="held"] { cursor: grabbing; }
    .cake-dial .hue { transition: opacity 0.15s; }
    .cake-dial .hue.out { opacity: 0.2; }
    .cake-dial .hue path { stroke-width: 0.5px; } /* its own colour: no seams between cells */
    .cake-dial .rim { fill: none; stroke: var(--muted); stroke-width: 1px; pointer-events: none; }
    .cake-dial .cut { stroke: var(--fg); stroke-width: 1.5px; pointer-events: none; }
    .cake-dial .ghost { fill: none; stroke: var(--fg); stroke-width: 1px; stroke-dasharray: 3 2; pointer-events: none; } /* as the pages dial's */
    .cake-dial path.ghost { fill: var(--fg); fill-opacity: 0.08; }
    .cake-dial .pointer { fill: var(--fg); stroke: var(--fg); stroke-width: 0.5px; stroke-linejoin: round; outline: none; } /* (the stroke: no seam where the two meet) */
    .cake-dial .pointer:focus-visible { stroke-width: 3px; }
    .cake-dial:has(.pointer:focus-visible) .rim { stroke: var(--fg); stroke-width: 2px; }
    @media (prefers-reduced-motion: reduce) { .cake-dial .hue { transition: none; } }
    /* Round the dial, the named hues; the two pages', if named, bright, as their sectors are. */
    .dial-label { position: absolute; transform: translate(var(--dx), var(--dy)); color: var(--muted); font-size: 0.7rem; line-height: 1.2; white-space: nowrap; transition: color 0.15s; }
    .dial-label:is(.on, :hover) { color: var(--fg); }
    @container (width < 13rem) { /* no room for them: the dial alone, as wide as the column */
      .dial-face { width: min(calc(var(--h) * 0.3), 100cqw); margin-left: 0; }
      .dial-label { display: none; }
    }
    @media (max-width: 600px) { /* no room to centre the disc: disc and control side by side, and room for the side labels */
      .atlas { --h: calc((100vw - 4rem) / 1.47); grid-template-columns: auto auto; justify-content: center; column-gap: 1rem; }
      .atlas:is([data-view="tones"], [data-view="flat"]) { --h: calc((100vw - 3rem) / 1.21); } /* no control beside PCCS's tones or Munsell's flat view: the screen's width */
      .atlas-disc, .view-caption { grid-column: 1; }
      .atlas-levels, .dial-box { grid-column: 2; }
      .dial-box { width: calc(var(--h) * 0.3); } /* the column fits its content here */
      .atlas-label { font-size: 0.65rem; white-space: normal; width: min-content; line-height: 1.2; }
      .atlas-disc > .page-label { display: none; } /* no room beside the pages' tips: the caption names their hues, left then right */
      /* no room beside the disc either: the info panel goes below it (a tapped empty cell's info stays) */
      .atlas-box { display: flex; flex-direction: column; }
      .atlas-box > .wheel-panel { position: static; transform: none; order: 1; align-self: center; margin-top: 1.5rem; }
      /* The wheel likewise: as wide as fits, with its control (in 2D) beside it */
      .wheel-views { --h: calc((100vw - 4rem) / 1.47); grid-template-columns: auto auto; justify-content: center; column-gap: 1rem; } /* (its frame as the other systems' discs': see .atlas) */
      .wheel-views[data-view="flat"] { --h: calc((100vw - 3rem) / 1.21); }
      .wheel-views > .wheel { grid-column: 1; }
      .wheel-views > .lightness-levels { grid-column: 2; }
    }

    dialog {
      width: min(calc(var(--info) + 4.5rem), calc(100% - 2rem)); /* text + padding + copy button */
      margin: auto;
      padding: 0; border: 0;
      background: var(--bg); color: var(--fg);
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.4); }
    .detail-swatch { height: 12rem; background: var(--color); }
    .detail-body { padding: 1.25rem; line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .detail-body h2 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; }
    .oklch-line { display: flex; align-items: center; gap: 0.5rem; }
    .detail-note { margin-top: 0.5rem; color: var(--muted); font-size: 0.8rem; white-space: normal; }
    .detail-warning { display: block; margin-top: 0.75rem; } /* an Ostwald cell's card: apart from its values */
    .copy {
      display: grid; padding: 0.25rem; margin: -0.25rem 0;
      border: 0; background: none; color: var(--muted); cursor: pointer;
    }
    .copy:hover, .copy:focus-visible { color: var(--fg); }
    .copy svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.25; }
    .copy .done, .copy.copied .idle { display: none; }
    .copy.copied .done { display: block; }
    .error { color: var(--muted); }

  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="#">
        <img src="favicon.svg" alt="" width="20" height="20">
        <div><strong>Ducktape Colours</strong> <span>| Colour systems</span></div>
      </a>
      <div class="views">
        <button type="button" class="theme-switch" aria-label="Dark theme" aria-pressed="false"><svg viewBox="-8 -8 16 16" width="16" height="16" aria-hidden="true"><circle r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 0 -6.5 A 6.5 6.5 0 0 1 0 6.5 Z" fill="currentColor"/></svg></button>
      </div>
    </nav>
  </header>

  <main>
    <section id="systems-view"></section>
  </main>

  <dialog id="detail">
    <div class="detail-swatch"></div>
    <div class="detail-body">
      <h2></h2>
      <p data-field="cmyk"></p>
      <p class="oklch-line">
        <span data-field="oklch"></span>
        <button type="button" class="copy" aria-label="Copy CSS colour" title="Copy CSS colour">
          <svg class="idle" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8"/><path d="M10.5 5.5v-3h-8v8h3"/></svg>
          <svg class="done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
        </button>
      </p>
      <p class="detail-note"></p>
    </div>
  </dialog>

  <script type="module">
    const views = { systems: document.getElementById("systems-view") }; // the one page: the colour systems
    const detail = document.getElementById("detail");
    // The header's height, for what sticks below it.
    new ResizeObserver(([entry]) => document.documentElement.style.setProperty("--header-height", `${entry.borderBoxSize[0].blockSize}px`))
      .observe(document.querySelector("header"));

    const cmykText = ([c, m, y, k]) => `C ${c} M ${m} Y ${y} K ${k}`;
    const oklchText = ([l, c, h]) => `oklch(${l} ${c} ${h})`;
    const oklchValues = ([l, c, h]) => `OKLCH ${l} ${c} ${h}`;
    const plural = (n, noun = "colour") => `${n} ${noun}${n === 1 ? "" : "s"}`; // "1 colour", "2 colours"
    // What's remembered in this browser (nothing, where its storage is blocked).
    const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
    const store = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

    let data = null; // set once the JSON has loaded
    const BIG = 1.6, DOT_GAP = 2.3; // Ostwald layout, every cell a dot: see along() below
    const printTables = {}, printLoads = {}; // the print profiles' tables, for CMYK estimates: see loadPrintTable() below
    let press = null; // what Wada's press prints (its gamut file, PRESS): Ostwald's system, and that profile's Print edge; see gamut() below
    let ostwaldCells = null, ostwaldCMYK = null; // Ostwald's system (see ostwaldShared), and its cells' estimated CMYK
    let munsellData = null, munsellCells = null; // munsell.json, and Munsell's system made from it (see munsellShared)
    let pccsData = null, pccsCells = null; // pccs.json, and PCCS made from it (see pccsShared)
    // The files not every view needs, each fetched when first needed (see need): what a press prints (its
    // gamut file: Wada's, PRESS, for the Ostwald view; each chosen print profile's, for its Print
    // range); and Munsell's and PCCS's, for their views. Each one's load, and its error if it couldn't be had.
    const PRESS = "gamuts/JapanColor2011Coated.json", loads = {}, loadErrors = {}; // (WADA_PRESS's, see PROFILES)
    // The systems, in the System switch's order (the most useful first): each its id, its name, the file
    // its view can't do without (fetched first, see filesFor), its model (its own colours, worked out from
    // that file before the view is made), how its view is made (make(colors, model) -> { box, adopt,
    // camera }), and its switches (see fitChoices): whether it has a profile (Screen or Print) to choose, its
    // slices, its views, and those with a space switch. To add one: an entry here and its view (a notation
    // like Munsell's can reuse makeNotation); see notes/architecture.md.
    const SYSTEMS = [
      { id: "oklch", name: "OKLCH", file: null, make: (colors) => makeWheel(colors),
        switches: { range: true, slicing: ["level", "pages"], views: ["flat", "2d", "3d"], space: ["flat", "2d", "3d"] } },
      { id: "munsell", name: "Munsell", file: "munsell.json", model: () => munsellShared(), make: (colors, model) => makeNotation(colors, model),
        switches: { range: true, slicing: ["level", "pages"], views: ["flat", "2d", "3d"], space: ["flat", "2d", "3d"] } },
      { id: "pccs", name: "PCCS", file: "pccs.json", model: () => pccsShared(), make: (colors, model) => makeNotation(colors, model),
        switches: { range: true, slicing: ["level", "pages", "tones"], views: ["flat", "2d", "tones", "3d"], space: ["flat", "2d", "3d"] } },
      { id: "ostwald", name: "Ostwald", file: PRESS, model: () => ostwaldShared(), make: (colors) => makeOstwald(colors),
        switches: { range: false, slicing: ["level", "pages"], views: ["flat", "2d", "3d"], space: [] } },
    ];
    const systemOf = (id) => SYSTEMS.find((s) => s.id === id);
    // The systems' views, each made the first time it's shown (see showLayout; being made: see settle):
    // each { box, adopt } (adopt: the shared choices shown, when it's shown again).
    const layouts = new Map();
    // The system chosen, in the switch that leads the one shown's switches (remembered by the page).
    let system = systemOf(stored("colors-system")) ? stored("colors-system") : SYSTEMS[0].id;
    // The systems' switches share their choices (saved under "systems-", see viewStore). Changing system
    // keeps each where the system has its switch and that choice; where it hasn't, the group's default.
    // What each system has: a range (Screen or Print), its slices, its views with choices (the tones are
    // PCCS's), and those with a space switch.
    const SYSTEM_DEFAULTS = { view: "2d", range: "screen", screen: "srgb", print: "fogra39", slicing: "level", cut: "top", space: "real", bg: "grid", strength: "full", wada: "grid" };
    // The views' choices, per view where they differ (see viewPrefs); and the Colour systems page's until chosen.
    const VIEW_VALUES = {
      space: ["real", "normalised"], strength: ["full", "faded"], wada: ["grid", "dots", "none"],
      bg: { flat: ["grid", "smooth", "griddot", "dots", "none"], "2d": ["grid", "smooth", "griddot", "dots", "none"], tones: ["grid", "griddot", "dots", "none"], "3d": ["grid", "walls", "solid", "griddot", "dots", "none"] },
    };
    const sharedDefaults = () => ({ space: SYSTEM_DEFAULTS.space, bg: SYSTEM_DEFAULTS.bg, strength: SYSTEM_DEFAULTS.strength, wada: SYSTEM_DEFAULTS.wada });
    // Where the shared choices are saved.
    const SHARED = "systems-";
    // The shared choices as `layout` has them, before it's shown: each it hasn't, or whose choice it hasn't,
    // its default.
    function fitChoices(layout) {
      const has = systemOf(layout).switches, prefix = SHARED;
      const fit = (key, values) => { if (!values.includes(stored(prefix + key))) store(prefix + key, SYSTEM_DEFAULTS[key.split("-").pop()]); };
      fit("view", ["flat", "2d", "3d"]);
      // The profile (Screen or Print, and which of each), kept by every system: Ostwald's is fixed, and
      // showing it leaves the others' choice as it was (see makeOstwald).
      fit("range", ["screen", "print"]);
      for (const kind of ["screen", "print"]) fit(kind, PROFILES.filter((p) => p.kind === kind).map((p) => p.id));
      fit("slicing", has.slicing);
      fit("cut", ["top", "bottom"]);
      for (const view of ["flat", "2d", "tones", "3d"]) {
        const shown = has.views.includes(view);
        fit(`v-${view}-space`, shown && has.space.includes(view) ? VIEW_VALUES.space : []);
        for (const key of ["bg", "strength", "wada"]) fit(`v-${view}-${key}`, !shown ? [] : key === "bg" ? VIEW_VALUES.bg[view] : VIEW_VALUES[key]);
      }
    }
    // The switch: changing system shows it (once made, the one shown till then staying).
    const systemOption = Object.assign(document.createElement("div"), { className: "view-option" });
    systemOption.dataset.option = "system";
    systemOption.innerHTML = `<div class="view-switch" role="group" aria-label="Colour system">`
      + SYSTEMS.map(({ id, name }) => `<button type="button" data-system="${id}">${name}</button>`).join("") + `</div>`;
    function chooseSystem(value, show = true) {
      system = value;
      store("colors-system", value);
      pressed(systemOption, "system", value);
      if (show) showLayout();
    }
    pressed(systemOption, "system", system);
    onChoice(systemOption, "system", chooseSystem);
    // Reset, last among the switches: every shared choice its default (the solid's peel, none), the system
    // and where each is kept (the level, the pages) staying. shown(): the system shown, its view's adopt.
    function resetSwitch(shown) {
      const option = Object.assign(document.createElement("div"), { className: "view-option" });
      option.dataset.option = "reset";
      option.innerHTML = `<div class="view-switch"><button type="button" title="Every switch back to its default">Reset</button></div>`;
      option.querySelector("button").addEventListener("click", () => {
        const prefix = SHARED;
        for (const [key, value] of Object.entries(SYSTEM_DEFAULTS)) if (!["space", "bg", "strength", "wada"].includes(key)) store(prefix + key, value);

      // 8, so as to reach Rec. 2020's most vivid colours (chroma 0.47, green), far past Wada's (0.22), and

      // Ostwald view: here, to lower hues), Page Up/Down (three pages, 30°), Home (0°); the mouse wheel.
      // Hovering previews a pair of pages without choosing it.
      const pageAt = (e) => {
        const label = e.target.closest?.("[data-slice]");
        if (label) return +label.dataset.slice;
        const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(dial.getScreenCTM().inverse());
        return wrap(Math.floor(((Math.atan2(-q.y, q.x) * 180) / Math.PI + 360) % 360 / SLICE));
      };
      sliderInput(dialFace, dial, {
        at: pageAt, get: () => page, set: setPage, preview: previewPage,
        keys: { ArrowRight: -1, ArrowDown: -1, ArrowLeft: 1, ArrowUp: 1, PageDown: -3, PageUp: 3 }, home: 0, spin: -1,
      });
      // The arrow keys, anywhere: in 2D, the next level, or the next pages (as the arrows under them).
      onArrows(layout, (step) => {
        if (view === "flat") return false;
        if (view === "3d" || slicing === "level") setLevel(level + step);
        else setPage(page + step);
      });

      // The 3D view's solid, made when it's shown for the look and range there (solidSlot: kept, or made a
      // slice at a time while the last stays), the 3D button disabled without WebGL 2. Returns whether it can be.
      let noSolid = false;
      const solidArgs = (start) => {
        const edgeOf = (h, L) => rho(most(L, h));
        return {
            colors,
            walls: {
              LEVELS, SLICE, PAGE_Y, AXIS, inner, out, room, steps, lightOf, rowOf, levelOf, isGrey, sliceOf, shareOf, ringOf, midHue, pageEdge, edgeAtL, pageCells, NAMED: G.NAMED, vivid, pageName,
              under: true, exact: !ballsInCells(), norm: opt.space === "normalised", edgeOf, onOpened: still3d, key: `oklch ${range}`,
              placeOf: (c) => [rho(c.oklch[1]), c.oklch[2], c.oklch[0]],
              linearAt: (h, L, r) => { const C = (r * edge) ** 2, a = (h * Math.PI) / 180; return oklabToLinearSRGB(L, C * Math.cos(a), C * Math.sin(a)); },
            },
            start,
            onColour: (c) => { under = ""; fillDetails(panel, c); panel.classList.add("show"); },
            onCell: (t) => showOwn(own(cellColour(t)), "Cell colour"),
            onLeave: () => { under = ""; hide(); },
            onOpen: showDetail,
            onOpenCell: (t) => openOwn(own(cellColour(t)), "Cell colour", "in the middle of this cell of the solid"),
            onPoint: (h, L, r) => showOwn(own(pointColour(h, L, r)), "Solid colour"),
            onOpenPoint: (h, L, r) => openOwn(own(pointColour(h, L, r)), "Solid colour", "at this place in the smooth solid"),
            onRestored: () => { // its GPU context lost and back: made again, as it was
              slot.drop(true);
              if (view === "3d" && !solidMade()) setView("2d");
            },
        };
      };
      const slot = solidSlot({
        make: (start) => oklchSolidSteps(solidArgs(start)),
        attach: (s) => {
          solid = s;
          if (cameraLater) s.restore({ ...s.state(), ...cameraLater });
          cameraLater = null;
          wheel.append(s.canvas, ...s.labels);
          s.look(opt);
          s.peel(peel);
          s.cut(shown);
          s.side(cutFrom, false);
          cake?.attach(s, dialHues());
          caption3d();
        },
        detach: (s) => {
          cake?.detach(s);
          if (solid === s) solid = null;
          solidFrom = s.state();
          s.unhover();
          s.canvas.remove();
          s.labels.forEach((b) => b.remove());
        },
      });
      const solidMade = () => {
        if (noSolid) return false; // (tried once: without WebGL 2, 3D can't be chosen again)
        solidLook = lookOf3d();
        if (slot.want(`${solidLook} ${range}`, solidFrom)) return true;
        noSolid = true;
        Object.assign(modes.querySelector('[data-wheel-view="3d"]'), { disabled: true, title: "3D needs WebGL 2, which this browser doesn't have" });
        return false;
      };
      // The solid made again for the look and range now, seen from where it was (made now if it's shown,
      // else when it next is; the last kept).
      const remakeSolid = () => {
        if (view === "3d") solidMade();
        else slot.drop();
      };
      const setView = (v) => {
        if (v === "3d") opt = prefs.load(v); // (the solid made for 3D's look)
        if (v === "3d" && !solidMade()) v = "2d";
        view = v;
        level = shown = levelSaved(v);
        pageShown = page;
        slicingOption.hidden = v !== "2d";
        cutOption.hidden = v !== "3d";
        pressed(modes, "wheel-view", v);
        save("wheel-view", v);
        loadLook();
        render();
      };
      // The profile: everything's drawn again in it, the 3D solid made again (seen from where it was).
      const setRange = (r, draw = true) => {
        showProfile(r);
        if (r === range) return;
        range = r;
        G = gamut(r);
        widths = null; // the level control's outline
        if (control.dataset.peel !== undefined) peelControl.redraw();
        hues?.forEach((g) => g.remove()); // the dial's colours
        hues = null;
        placeDialLabels();
        if (draw) remakeSolid();
        if (view === "2d" && slicing === "pages") dialHues();
        if (draw) render();
      };
      const showProfile = profileControl(modes, setRange);
      const setSlicing = (how) => {
        slicing = how;
        shown = level;
        pageShown = page;
        pressed(modes, "wheel-slicing", how);
        save("wheel-slicing", how);
        render();
      };
      onChoice(modes, "wheel-view", setView);
      const setCut = (where, animate) => {
        cutFrom = where;
        pressed(modes, "wheel-cut", where);
        save("wheel-cut", where);
        solid?.side(where, animate);
      };
      // 3D: Wada's balls in their cells (as dots on a grid in normalised
      // space), else at their own place; the solid made again when that or the space changes.
      const ballsInCells = () => opt.wada === "dots" && opt.space === "normalised" && ["grid", "griddot", "dots"].includes(opt.bg); // (on the grid in the smooth solid: blocks, as on the walls)
      const lookOf3d = () => `${opt.space} ${ballsInCells()}`;
      let solidLook = "";
      // A place in the smooth solid: its colour, exactly (hue h, lightness L, radius r: √chroma).
      const pointColour = (h, L, r) => {
        const C = (r * edge) ** 2;
        return { oklch: [L, C, h], key: `point ${L.toFixed(4)} ${C.toFixed(4)} ${h.toFixed(1)}`, line: `Lightness ${num(L)}, chroma ${num(C)}, hue ${Math.round(h)}°, in the smooth solid. ` };
      };
      // The solid's peel (its shell's strength), saved; and the caption, as it's peeled or opened.
      let peel = savedPeel(saved);
      const caption3d = () => {
        if (view !== "3d") return;
        drawLevel(shown, level, false);
        cake?.sync();
      };
      const still3d = caption3d;
      const prefs = viewPrefs(saved, save, sharedDefaults); // (the page's switches, saved per view: Flat, 2D, 3D)
      const setPeel = (p) => {
        peel = p;
        save("v-3d-peel", p);
        solid?.peel(p);
        caption3d();
      };
      const setCylinder = (on) => { // the level control's outline, for the space
        if (on === cylinder) return;
        cylinder = on;
        if (widths) { widths = null; halfWidth(0); } // (else made when first needed)
      };
      const showLook = () => {
        Object.assign(layout.dataset, { space: opt.space, bg: opt.bg, strength: opt.strength, wada: opt.wada });
        setCylinder(opt.space === "normalised");
        peelControl?.show(view === "3d", peel);
        for (const key of ["space", "strength", "wada"]) pressed(modes, key, opt[key]);
        pressed(modes, "bg", opt.bg);
        pressed(modes, "bg3", opt.bg);
        option("bg").hidden = view === "3d";
        option("bg3").hidden = view !== "3d";
        showLabels(view === "3d");
      };
      function loadLook() {
        opt = prefs.load(view);
        showLook();
        if (view === "3d") { if (solidLook !== lookOf3d()) remakeSolid(); solid?.look(opt); }
      }
      const choose = (key, value) => {
        hide();
        solid?.unhover();
        opt[key] = value;
        prefs.keep(view, key, value);
        showLook();
        if (view === "3d") {
          if (solidLook !== lookOf3d()) remakeSolid();
          solid?.look(opt);
          caption3d();
        } else render();
      };
      const showLabels = labelsSwitch(modes, box, saved, save);
      onChoice(modes, "wheel-slicing", setSlicing);
      for (const key of ["space", "strength", "wada"]) onChoice(modes, key, (value) => choose(key, value));
      onChoice(modes, "bg", (value) => choose("bg", value));
      onChoice(modes, "bg3", (value) => choose("bg", value));
      onChoice(modes, "wheel-cut", (where) => setCut(where, true));
      showProfile(range);
      pressed(modes, "wheel-slicing", slicing);
      pressed(modes, "wheel-cut", cutFrom);
      setView(view);
      // Shown again on the Colour systems page: the shared choices as they are now (another system's view may have
      // changed them), drawn once.
      const adopt = () => {
        hide();
        setRange(shownProfile(), false);
        slicing = saved("wheel-slicing") === "pages" ? "pages" : "level";
        pressed(modes, "wheel-slicing", slicing);
        setCut(saved("wheel-cut") === "bottom" ? "bottom" : "top", false);
        peel = savedPeel(saved);
        solid?.peel(peel);
        const at = cameraAt(80); // (oklchSolidSteps's start)
        if (at) solidFrom = { ...solidFrom, ...at };
        setView(viewSaved());
        if (at && solid) solid.restore({ ...solid.state(), ...at });
        else cameraLater = at; // (its solid still being made)
      };
      const camera = () => cameraOf(solid?.state() ?? solidFrom, 80);
      return { box, adopt, camera };
    }

    // A switch's buttons (as optionSwitch makes them, in modes): the one for value pressed; f called with
    // the value of each one clicked.
    function pressed(modes, key, value) {
      for (const b of modes.querySelectorAll(`[data-${key}]`)) b.setAttribute("aria-pressed", b.getAttribute(`data-${key}`) === value);
    }
    function onChoice(modes, key, f) {
      for (const b of modes.querySelectorAll(`[data-${key}]`)) b.addEventListener("click", () => f(b.getAttribute(`data-${key}`)));
    }

    // The switches above a view, in groups, each named: System (the page's, put in by showLayout), View and
    // Profile in a row; the view's own Options (and Reset, put in by showLayout) in the next. Each view
    // gives its groups' markup; pressed and onChoice find their buttons anywhere in it.
    function switchBar({ view, profile, options }) {
      const modes = Object.assign(document.createElement("div"), { className: "view-modes" });
      const group = (name, html) => `<div class="mode-group" data-group="${name.toLowerCase()}"><span class="group-name" aria-hidden="true">${name}</span><div class="group-body">${html}</div></div>`;
      modes.innerHTML = `<div class="mode-row">${group("System", "")}${group("View", view)}${group("Profile", profile)}</div>`
        + `<div class="mode-row">${group("Options", options)}</div>`;
      return modes;
    }
    // The Profile group's markup: Screen or Print, and which profile of that kind (a menu). `off`: why
    // there's none to choose, the group shown disabled (see makeOstwald).
    function profileSwitch(off = "") {
      const KINDS = [["screen", "Screen", "Screen. The colours an RGB space holds (choose which beside it)"], ["print", "Print", "Print. The colours a press prints (choose which beside it)"]];
      return `<div class="view-switch" role="group" aria-label="Screen or print"${off ? ` title="${off}"` : ""}>`
        + KINDS.map(([kind, text, title]) => `<button type="button" data-kind="${kind}" title="${off || title}"${off ? " disabled" : ""}>${text}</button>`).join("") + `</div>`
        + `<select class="profile-select" aria-label="Profile"${off ? ` title="${off}" disabled` : ""}></select>`;
    }
    // A view's Profile group, working: Screen or Print picks that kind's profile as chosen last, the menu
    // another; a press's gamut fetched first (the latest asked for applied once it's in; if it can't be
    // had, it's marked so and nothing changes). Each choice saved (the kind, and the profile for it), then
    // apply(id). Returns show(id): the group showing profile id.
    function profileControl(modes, apply) {
      const select = modes.querySelector(".profile-select");
      let shown = null, want = null;
      const failed = (p) => p.file && loadErrors[gamutFile(p)];
      const show = (id) => {
        const p = profileOf(id);
        shown = id;
        pressed(modes, "kind", p.kind);
        select.replaceChildren(...PROFILES.filter((q) => q.kind === p.kind).map((q) => Object.assign(new Option(failed(q) ? `${q.name} (couldn't load)` : q.name, q.id, false, q.id === id), { title: q.about, disabled: !!failed(q) })));
        if (!select.disabled) select.title = `${p.name}: ${p.about}`;
      };
      const choose = async (id) => {
        want = id;
        const p = profileOf(id);
        if (p.file && !gamutTables[id]) {
          const ok = await need(gamutFile(p));
          if (want !== id) return; // (another asked for since)
          if (!ok) { show(shown); return; }
        }
        store(`${SHARED}range`, p.kind);
        store(`${SHARED}${p.kind}`, id);
        if (p.kind === "print") loadPrintTable(id); // (the estimates')
        apply(id);
      };
      onChoice(modes, "kind", (kind) => choose(chosenProfile(kind)));
      select.addEventListener("change", () => choose(select.value));
      return show;
    }

    // The views' own switches, the same in every system:
    // the space, real or normalised; the background, the system's own colours, smooth, a grid, a grid with a
    // dot in each cell, only the dots, or none (in 3D, smooth walls or a smooth solid in smooth's place);
    // its strength, full or faded; and Wada's colours, on the grid, as dots or none. Each the same icon
    // everywhere: the space as an outline, uneven or round; a background as a square tile, shaded, cut
    // into cells, outlined cells with dots, dots alone, or dashed; in 3D, walls seen from above, or a
    // shaded cylinder; the strength as a tile, solid or pale; Wada's colours as marks on a dashed frame,
    // two cells filled, two dots off the grid, or none. `id`: for the gradients' ids, unique per view.
    function viewChoices(id) {
      const shade = (name) => `<defs><linearGradient id="${id}-${name}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="currentColor" stop-opacity="0.12"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs>`;
      const tile = (x, y, s = 5.6) => `<rect x="${x}" y="${y}" width="${s}" height="${s}"`;
      const corners = [[-6, -6], [0.4, -6], [-6, 0.4], [0.4, 0.4]];
      const frame = `<rect x="-6" y="-6" width="12" height="12" fill="none" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>`;
      const SPACE = [
        ["real", "Real space. Each colour at its own distance from the greys, inside the solid's true outline", `<path d="M -0.5 -6.6 C 3.4 -6.9 4.6 -3.2 6.2 -0.6 C 7.4 2.6 3.6 6.2 0.4 5.4 C -2.2 4.8 -3.4 6.6 -5.6 4.2 C -7.4 2.2 -5.2 -0.4 -5.8 -2.6 C -6.2 -5.2 -3.2 -6.4 -0.5 -6.6 Z" fill="none"/><circle r="1.3"/>`],
        ["normalised", "Normalised space. Every hue stretched to the same reach, each colour at its share of the way to its hue's edge", `<circle r="6.2" fill="none"/><circle r="1.3"/>`],
      ];
      const SMOOTH = ["smooth", "Smooth background. The system's colours continuous between its own, the pointer showing the colour exactly under it",
        `${shade("smooth")}<rect x="-6" y="-6" width="12" height="12" fill="url(#${id}-smooth)" stroke="none"/>`];
      const GRIDS = [
        ["grid", "Grid. Each cell filled with the system's own colour, its border drawn, the pointer showing that cell's colour", corners.map(([x, y]) => `${tile(x, y)} stroke="none"/>`).join("")],
        ["griddot", "Grid and dot. Each cell outlined, with a dot of its own colour in the middle", corners.map(([x, y]) => `${tile(x + 0.4, y + 0.4, 4.8)} fill="none" stroke-width="0.8"/><circle cx="${x + 2.8}" cy="${y + 2.8}" r="1.1"/>`).join("")],
        ["dots", "Dots. Only a dot of each cell's own colour", corners.map(([x, y]) => `<circle cx="${x + 2.8}" cy="${y + 2.8}" r="1.35" stroke="none"/>`).join("")],
        ["none", "No background. Only Wada's colours, in the solid's outline where the space is real", `<rect x="-6" y="-6" width="12" height="12" fill="none" stroke-dasharray="2.4 2.4"/>`],
      ];
      const SOLIDS = [
        ["walls", "Smooth walls. The pages as walls with gaps between, their edges smooth, their cells in the system's own colours",
          [0, 60, -60].map((deg) => `<rect x="-0.75" y="-6.6" width="1.5" height="13.2" stroke="none" transform="rotate(${deg})"/>`).join("")],
        ["solid", "Smooth solid. The whole solid in continuous colour, peeled by strength with the upright line beside it, cut by lightness, and opened by clicking a hue's name",
          `${shade("solid")}<path d="M -5.6 -4.2 A 5.6 2 0 0 1 5.6 -4.2 V 4.2 A 5.6 2 0 0 1 -5.6 4.2 Z" fill="url(#${id}-solid)" stroke="none"/><ellipse cy="-4.2" rx="5.6" ry="2" fill="none" stroke-width="0.8"/>`],
      ];
      const STRENGTH = [
        ["full", "Background at full strength", `<rect x="-6" y="-6" width="12" height="12" stroke="none"/>`],
        ["faded", "Background faded, so that Wada's colours stand out", `<rect x="-5.4" y="-5.4" width="10.8" height="10.8" fill-opacity="0.28" stroke-width="0.9"/>`],
      ];
      const WADA = [
        ["grid", "Wada's colours on the grid. Each fills its piece of its cell", `${frame}${tile(-6, -6)} stroke="none"/>${tile(0.4, 0.4)} stroke="none"/>`],
        ["dots", "Wada's colours as dots, each at its own place (in 3D, balls)", `${frame}<circle cx="-2.2" cy="-1.6" r="2.3" stroke="none"/><circle cx="2.7" cy="2.9" r="2.3" stroke="none"/>`],
        ["none", "Wada's colours hidden", frame],
      ];
      const around = (dashed) => `<circle r="3.2" stroke="none"/>` + (dashed ? `<circle r="6.2" fill="none" stroke-width="0.8" stroke-dasharray="1.6 1.6"/>`
        : [0, 60, 120, 180, 240, 300].map((deg) => `<circle cx="${(6.2 * Math.cos((deg * Math.PI) / 180)).toFixed(2)}" cy="${(6.2 * Math.sin((deg * Math.PI) / 180)).toFixed(2)}" r="1.1" stroke="none"/>`).join(""));
      const LABELS = [
        ["shown", "Labels shown. The pages' names and dots round the solid, each hiding or showing its page", around(false)],
        ["hidden", "Labels hidden. The solid alone", around(true)],
      ];
      return { SPACE, BG: [GRIDS[0], SMOOTH, ...GRIDS.slice(1)], BG3: [GRIDS[0], ...SOLIDS, ...GRIDS.slice(1)], STRENGTH, WADA, LABELS }; // (each list the most used first, the first its default)
    }
    // The switches' markup, in their order everywhere (the most used first): background (2D and Flat's, and
    // 3D's, only one shown), strength, Wada's colours, space, and in 3D the labels round the solid. `space`: whether the system has the space switch; or, where it has
    // none, why, and the switch is there, off, so that the others stay in their places.
    function viewSwitches(id, space = true) {
      const { SPACE, BG, BG3, STRENGTH, WADA, LABELS } = viewChoices(id);
      return optionSwitch("Background", "bg", BG) + optionSwitch("Background", "bg3", BG3) + optionSwitch("Strength", "strength", STRENGTH) + optionSwitch("Wada's", "wada", WADA)
        + (space ? optionSwitch("Space", "space", SPACE, space === true ? "" : space) : "") + optionSwitch("Labels", "labels", LABELS);
    }
    // The 3D view's labels round the solid (its pages' names, and dots for the unnamed), shown or hidden: saved
    // once for every system (as the peel), on `box`'s data for the CSS, its switch shown in 3D only. Returns
    // what shows the choice as saved (another system's view may have changed it), for the view's showLook.
    function labelsSwitch(modes, box, saved, save) {
      const show = (in3d) => {
        const value = saved("v-3d-labels") === "hidden" ? "hidden" : "shown";
        box.dataset.labels = value;
        pressed(modes, "labels", value);
        modes.querySelector('[data-option="labels"]').hidden = !in3d;
      };
      onChoice(modes, "labels", (value) => { save("v-3d-labels", value); show(true); });
      return show;
    }
    // The systems share their switches' choices: a system's view's saved choices are its own (under `prefix`:
    // the level, the pages), but its switches' (`aliases`: its own names for the view, range, slice and
    // cut; and the views' choices, v-...) are saved under `shared` (SHARED), the same for every system (see fitChoices).
    function viewStore(prefix, shared, aliases) {
      const keyOf = (key) => {
        const common = aliases[key] ?? (key.startsWith("v-") ? key : null);
        return common ? shared + common : prefix + key;
      };
      return { saved: (key) => stored(keyOf(key)), save: (key, value) => store(keyOf(key), value) };
    }
    // A view's choices, saved per system and per view (Flat, 2D, the tones, 3D: what applies differs), each
    // from its default (defaults(view)) until chosen.
    function viewPrefs(saved, save, defaults) {
      const ok = (view, key, value) => (key === "bg" ? VIEW_VALUES.bg[view] : VIEW_VALUES[key]).includes(value);
      return {
        load: (view) => {
          const d = defaults(view);
          return Object.fromEntries(Object.keys(d).map((key) => {
            const value = saved(`v-${view}-${key}`);
            return [key, ok(view, key, value) ? value : d[key]];
          }));
        },
        keep: (view, key, value) => save(`v-${view}-${key}`, value),
      };
    }
    // The backgrounds that draw the cells (a grid, grid and dot, dots); and, for each background, how the
    // empty cells show (data-empty, for the CSS and the 3D solid).
    const CELL_BGS = ["grid", "griddot", "dots"];
    const EMPTY_OF = { smooth: "hidden", walls: "filled", solid: "filled", grid: "filled", griddot: "dots", dots: "points", none: "hidden" };
    // The solid's peel as saved (0 to 1: its shell's strength), the whole solid if none.
    function savedPeel(saved) {
      const p = Number(saved("v-3d-peel") ?? 1);
      return Number.isFinite(p) ? Math.min(1, Math.max(0, p)) : 1;
    }
    // A colour of a smooth field (OKLab), as the panel and card show it: its values (as Wada's colours are
    // given), and the nearest of the system's own colours (nearest(oklch)).
    function smoothOwnOf([L, a, b], nearest) {
      const C = Math.hypot(a, b), h = ((Math.atan2(b, a) * 180) / Math.PI + 360) % 360;
      const oklch = [+L.toFixed(4), +C.toFixed(4), C >= 5e-5 ? +h.toFixed(2) : 0];
      return { oklch, css: oklchText(oklch), near: nearest(oklch) };
    }

    // The Ostwald view's and the notations' frame (makeOstwald, makeNotation): the info panel, its system's
    // `fields` after the CMYK and OKLCH, and the disc (an svg, `label`: the cells, and the `rim` (a
    // path or circle) above them if rimAbove, else below, then the highlight), the hues named round it (`names`: [angle, name], as polar's), and, sliced
    // through the axis, the two pages' labels.
    function atlasFrame({ className, fields, label, rim, rimAbove, names }) {
      const box = Object.assign(document.createElement("div"), { className: `atlas-box ${className}` });
      const panel = Object.assign(document.createElement("aside"), { className: "wheel-panel" });
      panel.setAttribute("aria-live", "polite");
      panel.innerHTML = `<div class="detail-swatch"></div><h2></h2><p data-field="cmyk"></p><p data-field="oklch"></p>`
        + fields.map((name) => `<p data-field="${name}"></p>`).join("");
      const layout = Object.assign(document.createElement("div"), { className: "atlas" });

        clipEdge.setAttribute("d", d(([x, y]) => `${((x + 1.45) / 2.9).toFixed(5)} ${((y + 1.2) / 2.4).toFixed(5)}`));

        paint: (job) => {

    // A notation's view (Munsell's or PCCS's, `sys`, as munsellSystem and pccsSystem make them), as the

    // as the hue numbers rise, as OKLCH's hues: red near the right, yellow at the top), distance from the
    // centre = chroma or saturation (a ring per step of it, out from the level's grey at the centre). The
    // rings go as far as the profile shown holds the system's own colours (a screen's or a press's, see
    // PROFILES), as in the OKLCH view, all at one scale; or further, to one of Wada's colours. Each of Wada's
    // colours fills the cell of its rounded notation (the panel gives its exact one); colours sharing a
    // cell split it in hue order, and the empty cells show a dot of the system's own colour (its CMYK
    // estimated, as the OKLCH view's), or as the cells switch says. Beside it, the level control: the greys,
    // the lightest at the top, and the solid's outline (at each level, as wide as its widest page) with the
    // slice. Sliced through the axis instead, two pages back to back (a hue's and the opposite one's), with
    // a dial in the control's place; or, in 3D, the whole solid, its pages as walls (oklchSolidSteps, with
    // these cells). PCCS also has its tones: each a ring of the hues (see drawTones).
    function makeNotation(colors, sys) {
      const { key: KEY, PAGES, LEVELS, JMAX, pageName, chip, grey } = sys;
      const N = LEVELS.length, DEG = 360 / PAGES, MID = (N - 1) / 2; // levels; a page's angle; the middle level (the pages' middle row)
      const P = KEY; // its saved choices' and its ids' prefix
      const { saved, save } = viewStore(`${P}-`, SHARED, { mode: "view", range: "range", slicing: "slicing", cut: "cut" }); // (its switches' shared: see viewStore)
      let range = shownProfile(), fit = sys.fit(range); // the profile shown (as the OKLCH view's)
      loadPrintTable(); // for the empty cells' CMYK
      const wrap = (k) => ((k % PAGES) + PAGES) % PAGES, opposite = (k) => (k + PAGES / 2) % PAGES;
      // The disc: the grey at the centre, INNER round (wider than a ring, so that the first ring's cells
      // aren't slivers), then the rings, RING wide each, JMAX of them to the rim (1).
      const INNER = 0.12, RING = (1 - INNER) / JMAX;
      const off = (c, k) => ((((c[KEY].hue - k + PAGES / 2) % PAGES) + PAGES) % PAGES) - PAGES / 2; // its hue from the page's, in pages
      const levelWord = sys.levelWord, LevelWord = levelWord[0].toUpperCase() + levelWord.slice(1);

      // The disc, the hues named round it, and, sliced through the axis, the two pages' hues, named at
      // their widest (left, right); the rim, how far Screen goes, for scale, under the cells.
      const LINES = sys.ownLines(grey(0), "").length; // the system's lines: its code, and so on
      const rim = svgEl("path", { class: "rim" });
      const { box, panel, layout, disc, svg, cells, highlight, pageLabels } = atlasFrame({
        className: `${KEY}-box`, fields: Array.from({ length: LINES }, (_, n) => `${KEY}-${n}`), label: `A ${levelWord} of ${sys.solid}`,
        rim, names: sys.DISC.map(([k, name]) => [k * DEG, name]),
      });
      // The caption; sliced through the axis, with a button each side to turn the slice a page back or on.
      const { caption, text: captionText, turns, still } = viewCaption((step) => (disc.dataset.slicing === "tones" && toneFocus ? stepTone(step) : setPage(page + step)));

      // The level control: the greys, the lightest at the top, each CH tall, and beside them the solid seen
      // from the side (at each level as wide as its widest page), with the slice.
      const CH = 32 / N, CX = 5.5, W = 2.8; // a level's height; the solid's axis and half-width

        const label = svgEl("text", { x: 0.9, y: rowY(i), "font-size": 0.7, "text-anchor": "middle", "dominant-baseline": "central", fill: LEVELS[i] >= 6 ? "rgb(0 0 0 / 0.6)" : "rgb(255 255 255 / 0.75)" });

        shell: (p) => {

      // The switches: the view (Flat, 2D or 3D, made when first asked for) and the range; then, as in the

      // viewSwitches) and the cut (3D).

      const OUTLINE = `<ellipse rx="5" ry="7" fill="none"/>`;
      const SLICING = [
        ["level", `Slice across the axis, one ${levelWord}, seen from above`, `${OUTLINE}<ellipse rx="5" ry="1.7"/>`],
        ["pages", "Slice through the axis, a hue's page and the opposite hue's, back to back", `${OUTLINE}<ellipse rx="1.7" ry="7"/>`],
        ...(sys.tones ? [["tones", "The tones, each a ring of the hues, across by saturation and up by lightness, the greys' on the left", `<circle cx="-5" cy="-4.5" r="1.6"/><circle cx="-5" cy="0" r="1.6"/><circle cx="-5" cy="4.5" r="1.6"/><circle cx="1" cy="-3.5" r="2.4" fill="none"/><circle cx="1" cy="3" r="2.4" fill="none"/><circle cx="5.6" cy="0" r="2.4" fill="none"/>`]] : []),

        profile: profileSwitch(),

      });

      box.append(panel, layout);
      let solid = null, solidFrom = null, cameraLater = null, cut = "top"; // the 3D view's (oklchSolidSteps); where the last one was seen from; the camera to turn it to once made (see adopt)
      // The view's choices (Flat's, 2D's, the tones', 3D's), saved per view.
      const prefs = viewPrefs(saved, save, sharedDefaults);

      const where = (o) => `${sys.source}${fit.holds(o) ? "" : profileOf(range).kind === "print" ? `, which ${profileOf(range).name} can't print` : `, beyond ${profileOf(range).name}`}`;

      const centre = (i, m) => (m === 1 ? circlePath(0, 0, INNER) : ringSector(0, INNER, 90 - ((i + 1) * 360) / m, 90 - (i * 360) / m));
      // An empty cell's dot: smaller near the centre, where the cells narrow.

      // path from pathOf(r0, r1, d0, d1)), BIG times its empty dot (`small`), by chroma (the least nearest
      // the centre), each row in hue order (as rowDots has them).
      const sectorDots = (list, k, r0, r1, small, pathOf = ringSector, x0 = 0, y0 = 0) => rowDots(list, {

      const pageRim = svgEl("path", { class: "rim", d: rect(-(AX + JMAX * CELL), pageY(0) - ROW / 2, AX + JMAX * CELL, pageY(N - 1) + ROW / 2) }); // how far Screen goes, for scale

      };

        clear();

          () => { // (fine enough to show no corners)

            const right = [], other = [];

        // (unrounded; in normalised space, that share of the way to the row's edge there).

            const [side, i, j] = key.split(" ").map(Number), [x0, x1] = span(side, i, j), y = pageY(i), m = list.length;

            place(size).forEach(([px, py], u) => wadaDot(list[u], piece(u), { x: px, y: py, r: size }));

        pageRim.setAttribute("visibility", "visible");

        // The hues, at the pages' widest.

          pageLabels[u].style.top = `${((pageY(i) + 1.2) / 2.4) * 100}%`;
        });

        const hue = (page, after = "") => {

          span.append(sys.hueTitle(page), chipOf(vivid(page)), after);

        };

        turns(`Previous pages: ${pageName(wrap(chosen - 1))} on the right`, `Next pages: ${pageName(wrap(chosen + 1))} on the right`);
        // The dial: the chosen pages, and a ghost of those previewed.
        dialHues();
        const on = [k, left, chosen, opposite(chosen)];
        hues.forEach((g, p) => g.classList.toggle("on", on.includes(p)));
        dialLabels.forEach((label) => label.classList.toggle("on", on.includes(+label.dataset.page)));

        dial.setAttribute("aria-valuetext", `${pageName(chosen)} on the right, ${pageName(chosenText.left)} on the left, ${chosenText.count}`);

      // disc shows it (yellow at the top), each page a group, so that the two shown can be bright.
      const { dial, face: dialFace, box: dialBox, mark: markDial, place: placeLabel } = makeDial(polar, "Pages: the hue on the right, the opposite hue on the left", PAGES - 1);
      let hues = null; // made for the range shown
      const dialHues = () => {
        if (hues) return;

          const g = svgEl("g", { class: "hue" }), { i, n } = widest(k);
